name: Compile Transparent Asymptote PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем всю историю, чтобы избежать конфликтов при пуше

      - name: Install TeX Live and Asymptote
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full asymptote ghostscript

      - name: Compile Document
        run: |
          # 1. Первый проход для генерации временных .asy файлов
          pdflatex -shell-escape vector_globe.tex
          
          # 2. Компиляция графики Asymptote
          for f in *.asy; do
            [ -e "$f" ] || continue
            asy -f pdf "$f"
          done
          
          # 3. Финальная сборка документа
          pdflatex -shell-escape vector_globe.tex

      - name: Commit and Push compiled PDF
        run: |
          mkdir -p output
          cp vector_globe.pdf output/vector_globe.pdf
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add output/vector_globe.pdf
          
          # Проверяем изменения, подтягиваем свежий код из репозитория и пушим
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update transparent vector_globe.pdf [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
