name: Render Asymptote 3D
on: [push, workflow_dispatch]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Asymptote and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y asymptote imagemagick xvfb libgl1-mesa-dri

      - name: Fix ImageMagick Policy (Allow PDF/PNG conversions)
        run: |
          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      - name: Render 3D with Alpha Channel
        run: |
          # 1. Рендерим 3D-сцену на стандартном белом фоне в ультра-качестве
          xvfb-run -a asy -f png -render=8 -multisample=4 1.asy
          
          # 2. Утилита ImageMagick берет файл 1.png, стирает белый цвет и перезаписывает его
          convert 1.png -transparent white 1.png

      - name: Upload Finished Transparent PNG
        uses: actions/upload-artifact@v4
        with:
          name: transparent-3d-model
          path: 1.png
