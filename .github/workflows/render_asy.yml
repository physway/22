name: Compile LaTeX with Transparent Asymptote

on:
  push:
    branches: [ "main" ] # запускать при пуше в ветку main
  workflow_dispatch: # возможность запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live and Asymptote
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full asymptote ghostscript

      - name: Compile Document
        run: |
          # 1. Первый проход LaTeX (генерирует временные .asy файлы для графики)
          pdflatex -shell-escape main.tex
          
          # 2. Компиляция всех сгенерированных файлов Asymptote
          # Флаг -bg 0 принудительно задает прозрачный фон на уровне консоли
          for f in *.asy; do
            [ -e "$f" ] || continue
            asy -f pdf -bg 0 "$f"
          done
          
          # 3. Второй проход LaTeX (встраивает готовые прозрачные PDF-куски в документ)
          pdflatex -shell-escape main.tex

      - name: Upload PDF Artifact
        uses: actions/artifacts@v4
        with:
          name: compiled-pdf
          path: main.pdf
