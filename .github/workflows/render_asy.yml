name: Compile Transparent Asymptote PDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live and Asymptote
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full asymptote ghostscript

      - name: Compile Document
        run: |
          # 1. Первый проход для генерации временных .asy файлов графики
          pdflatex -shell-escape vector_globe.tex
          
          # 2. Компиляция графики Asymptote (прозрачность берется из настроек кода)
          for f in *.asy; do
            [ -e "$f" ] || continue
            asy -f pdf "$f"
          done
          
          # 3. Финальная сборка документа с внедрением графики
          pdflatex -shell-escape vector_globe.tex

      - name: Commit and Push compiled PDF
        run: |
          mkdir -p output
          cp vector_globe.pdf output/vector_globe.pdf
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add output/vector_globe.pdf
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update transparent vector_globe.pdf [skip ci]" && git push)
