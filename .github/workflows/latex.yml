name: Compile LaTeX with Complex 3D Asymptote

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      - name: Install LaTeX, Asymptote, Inkscape and Xvfb 3D Drivers
        run: |
          sudo apt-get update
          # Устанавливаем пакеты для LaTeX и виртуальный экран Xvfb с драйверами OpenGL
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science texlive-lang-cyrillic cm-super asymptote texlive-bibtex-extra biber inkscape xvfb libgl1-mesa-dri

      - name: Compile Document and 3D Render
        run: |
          # Заходим в вашу обычную папку src
          cd src
          
          # 1. Первый проход LaTeX для создания вспомогательных файлов
          pdflatex -interaction=nonstopmode -shell-escape -jobname=diploma_final main.tex || true
          
          # 2. Рендеринг сложной 3D графики Asymptote через виртуальный дисплей (xvfb-run)
          # Флаг -f pdf принудительно собирает графику в качественном векторном PDF формате
          xvfb-run -a asy -f pdf *.asy || echo "No .asy files to compile"
          
          # 3. Сборка библиографии
          biber diploma_final || echo "No bibliography to compile"
          
          # 4. Финальные проходы LaTeX для правильной верстки и вставки 3D рисунков
          pdflatex -interaction=nonstopmode -shell-escape -jobname=diploma_final main.tex || true
          pdflatex -interaction=nonstopmode -shell-escape -jobname=diploma_final main.tex || true

      - name: Commit and Push PDF and Graphics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # Добавляем скомпилированный PDF и сгенерированные 3D-рисунки из папки src
          git add src/diploma_final.pdf
          git add src/*.pdf || echo "No generated vector graphics to add"
          
          git commit -m "Automated PDF and 3D Asymptote generation" || echo "No changes to commit"
          git push
