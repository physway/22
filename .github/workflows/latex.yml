name: Compile LaTeX with Complex 3D Asymptote

on:
  push:
    branches: [ "main" ]
    # Игнорируем запуск, если изменения произошли ТОЛЬКО в папке output
    paths-ignore:
      - 'output/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем всю историю, чтобы избежать конфликтов при пуше

      - name: Install LaTeX, Asymptote, Inkscape and Xvfb 3D Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science texlive-lang-cyrillic cm-super asymptote texlive-bibtex-extra biber inkscape xvfb libgl1-mesa-dri ghostscript

      - name: Compile All Documents and 3D Render
        run: |
          # 1. Сначала компилируем ваш отдельный файл vector_globe.tex с прозрачностью (если он существует)
          if [ -f "vector_globe.tex" ]; then
            echo "Компиляция vector_globe.tex со встроенной прозрачностью..."
            pdflatex -interaction=nonstopmode -shell-escape vector_globe.tex || true
            xvfb-run -a asy -f pdf vector_globe-*.asy || echo "Нет asy файлов для vector_globe"
            pdflatex -interaction=nonstopmode -shell-escape vector_globe.tex || true
            
            mkdir -p output
            cp vector_globe.pdf output/vector_globe.pdf
          fi

          # 2. Затем выполняем ваш стандартный обход всех папок с main.tex
          find . -name "main.tex" | while read -r MAIN_FILE_PATH; do
            DIR_PATH=$(dirname "$MAIN_FILE_PATH")
            PDF_NAME=$(basename "$DIR_PATH")
            
            # Пропускаем служебные папки (например, если main.tex случайно попал в кэш)
            if [[ "$DIR_PATH" == *"output"* ]]; then continue; fi
            
            echo "--------------------------------------------------"
            echo "Найдена папка проекта: $DIR_PATH"
            echo "Файл PDF будет сохранен как: $DIR_PATH/$PDF_NAME.pdf"
            echo "--------------------------------------------------"
            
            ROOT_DIR=$(pwd)
            cd "$DIR_PATH"
            
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            xvfb-run -a asy -f pdf *.asy || echo "No .asy files to compile in $DIR_PATH"
            biber "$PDF_NAME" || echo "No bibliography to compile in $DIR_PATH"
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            
            cd "$ROOT_DIR"
          done

      - name: Commit and Push All PDFs and Graphics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Добавляем все сгенерированные PDF, включая папку output
          find . -name "*.pdf" -exec git add {} +
          if [ -d "output" ]; then git add output/; fi
          
          # Безопасный пуш с подтяжкой изменений, предотвращающий бесконечный цикл [skip ci]
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Automated PDF generation [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
