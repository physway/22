name: Compile LaTeX with Asymptote

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      # Устанавливаем легкий набор TeX Live и сам компилятор Asymptote напрямую в систему
      - name: Install LaTeX and Asymptote
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science asymptote

      - name: Compile Document
        run: |
          # 1. Сборка для генерации временных .asy файлов
          pdflatex -interaction=nonstopmode main.tex || true
          
          # 2. Компиляция графики Asymptote (теперь команда точно найдется)
          asy *.asy
          
          # 3. Финальная сборка со вшитой графикой
          pdflatex -interaction=nonstopmode main.tex

      - name: Upload PDF Result
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: main.pdf
