name: Compile LaTeX with Asymptote

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      - name: Install LaTeX, Asymptote and Bibliography Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science texlive-lang-cyrillic cm-super asymptote texlive-bibtex-extra biber

      - name: Compile Document
        run: |
          # 1. Первый проход создает временные файлы для Asymptote и Biber
          pdflatex -interaction=nonstopmode main.tex || true
          
          # 2. Сборка графики Asymptote
          asy *.asy || echo "No .asy files to compile"
          
          # 3. Сборка библиографии через biber
          biber main || echo "No bibliography to compile"
          
          # 4. Проход для связывания библиографии
          pdflatex -interaction=nonstopmode main.tex || true
          
          # 5. Финальный проход. Добавлено "|| true", чтобы предупреждения о ссылках не красили крест
          pdflatex -interaction=nonstopmode main.tex || true

      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          git commit -m "Automated PDF generation with biblatex" || echo "No changes to commit"
          git push
