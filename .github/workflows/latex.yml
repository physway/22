name: Compile LaTeX with Asymptote

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      # Используем официальный экшен от IslandofTeX
      - name: Compile LaTeX Document
        uses: IslandofTeX/texlive-action@v2
        with:
          # Устанавливаем системный пакет asymptote перед компиляцией
          package_blocklist: ""
          run: |
            apt-get update && apt-get install -y asymptote
            latexmk -pdf main.tex
