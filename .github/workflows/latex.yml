name: Compile LaTeX with Asymptote

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # Запускаем сборку прямо внутри Docker-контейнера, где TeX и Asymptote уже есть
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      - name: Compile Document
        run: |
          # 1. Первый проход LaTeX для генерации .asy файлов
          pdflatex -interaction=nonstopmode main.tex || true
          
          # 2. Компиляция графики Asymptote
          asy *.asy
          
          # 3. Финальный проход LaTeX для вшивания графики в PDF
          pdflatex -interaction=nonstopmode main.tex

      - name: Upload PDF Result
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: main.pdf
