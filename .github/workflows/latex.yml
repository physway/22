name: Compile LaTeX with Complex 3D Asymptote

on: [push]

permissions:
  contents: write # Оставляем только права на запись в репозиторий

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      - name: Install LaTeX, Asymptote, Inkscape and Xvfb 3D Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science texlive-lang-cyrillic cm-super asymptote texlive-bibtex-extra biber inkscape xvfb libgl1-mesa-dri

      - name: Compile All Documents and 3D Render
        run: |
          find . -name "main.tex" | while read -r MAIN_FILE_PATH; do
            DIR_PATH=$(dirname "$MAIN_FILE_PATH")
            PDF_NAME=$(basename "$DIR_PATH")
            
            echo "--------------------------------------------------"
            echo "Найдена папка проекта: $DIR_PATH"
            echo "Файл PDF будет сохранен как: $DIR_PATH/$PDF_NAME.pdf"
            echo "--------------------------------------------------"
            
            ROOT_DIR=$(pwd)
            cd "$DIR_PATH"
            
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            xvfb-run -a asy -f pdf *.asy || echo "No .asy files to compile in $DIR_PATH"
            biber "$PDF_NAME" || echo "No bibliography to compile in $DIR_PATH"
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            
            cd "$ROOT_DIR"
          done

      - name: Commit and Push All PDFs and Graphics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          find . -name "*.pdf" -exec git add {} +
          
          git commit -m "Automated PDF generation for all project folders" || echo "No changes to commit"
          git push
