name: Compile LaTeX with Asymptote

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          # Важно: берем полный образ TeX Live, где точно есть asy
          image_tag: latest-full
          # Выполняем ручную пошаговую сборку вместо автоматического latexmk
          compiler: pdflatex
          root_file: main.tex
          # Передаем команды последовательно: 
          # 1. Сборка TeX -> 2. Сборка ВСЕХ картинок Asymptote -> 3. Финальная сборка PDF
          args: -interaction=nonstopmode && asy *.asy && pdflatex -interaction=nonstopmode main.tex

      - name: Upload PDF Result
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: main.pdf
