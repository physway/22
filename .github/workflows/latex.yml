name: Compile LaTeX with Complex 3D Asymptote

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'output/**'
      - '*.pdf'
      - '*.png'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install LaTeX, Asymptote, Inkscape and Xvfb 3D Drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science texlive-lang-cyrillic cm-super asymptote texlive-bibtex-extra biber inkscape xvfb libgl1-mesa-dri ghostscript

      - name: Compile All Documents and 3D Render
        run: |
          mkdir -p output

          # 1. Сборка vector_globe.tex через прозрачный растровый буфер высокого качества
          if [ -f "vector_globe.tex" ]; then
            echo "Компиляция файла vector_globe.tex..."
            pdflatex -interaction=nonstopmode -shell-escape vector_globe.tex || true
            
            # Генерируем PNG высокого разрешения с альфа-каналом
            xvfb-run -a asy vector_globe-*.asy || echo "Ошибка при рендере asy"
            
            # Переименовываем сгенерированный PNG, чтобы LaTeX гарантированно вставил картинку, а не пустой код
            if [ -f "vector_globe-1.png" ]; then
              mv vector_globe-1.png vector_globe-1.pdf.png 2>/dev/null || true
            fi
            
            # Финальный проход LaTeX: упаковываем прозрачный PNG внутрь PDF
            pdflatex -interaction=nonstopmode -shell-escape vector_globe.tex || true
            
            cp vector_globe.pdf output/vector_globe.pdf
            rm -f vector_globe.pdf vector_globe-*.pdf vector_globe-*.png vector_globe-*.tex
          fi

          # 2. Обход всех остальных проектов main.tex во вложенных папках
          find . -name "main.tex" | while read -r MAIN_FILE_PATH; do
            DIR_PATH=$(dirname "$MAIN_FILE_PATH")
            PDF_NAME=$(basename "$DIR_PATH")
            
            if [[ "$DIR_PATH" == *"output"* ]]; then continue; fi
            
            echo "--------------------------------------------------"
            echo "Найдена папка проекта: $DIR_PATH"
            echo "Файл PDF будет сохранен как: $DIR_PATH/$PDF_NAME.pdf"
            echo "--------------------------------------------------"
            
            ROOT_DIR=$(pwd)
            cd "$DIR_PATH"
            
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            xvfb-run -a asy -f pdf *.asy || echo "No .asy files to compile in $DIR_PATH"
            biber "$PDF_NAME" || echo "No bibliography to compile in $DIR_PATH"
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            pdflatex -interaction=nonstopmode -shell-escape -jobname="$PDF_NAME" main.tex || true
            
            cd "$ROOT_DIR"
          done

      - name: Commit and Push All PDFs and Graphics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          rm -f *.pdf *.png
          
          if [ -d "output" ]; then git add output/; fi
          find src/ -name "*.pdf" -exec git add {} + 2>/dev/null || true
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Automated PDF generation [skip ci]"
            git pull --rebase -Xtheirs --autostash origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
