name: Compile LaTeX with Asymptote

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          # Важно: используем образ full, где уже есть компилятор Asymptote
          compiler: latexmk
          image_tag: latest-full

      - name: Upload PDF Result
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: main.pdf
