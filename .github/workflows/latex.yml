name: Compile LaTeX with Asymptote and SVG

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git Repository
        uses: actions/checkout@v4

      # Добавили inkscape для работы с SVG графикой
      - name: Install LaTeX, Asymptote and Inkscape
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-science texlive-lang-cyrillic cm-super asymptote texlive-bibtex-extra biber inkscape

      - name: Compile Document
        run: |
          # Везде добавляем флаг -shell-escape, чтобы LaTeX мог вызывать Inkscape
          pdflatex -interaction=nonstopmode -shell-escape main.tex || true
          
          asy *.asy || echo "No .asy files to compile"
          biber main || echo "No bibliography to compile"
          
          pdflatex -interaction=nonstopmode -shell-escape main.tex || true
          pdflatex -interaction=nonstopmode -shell-escape main.tex || true

      - name: Commit and Push PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          git commit -m "Automated PDF generation with SVG and Asymptote" || echo "No changes to commit"
          git push
